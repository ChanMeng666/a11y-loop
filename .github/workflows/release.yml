name: Release (npm via OIDC)

# Publishing only. Tests run in ci.yml on every push — they need Playwright
# browsers, which this job deliberately does not install.
#
# The workflow FILENAME is part of the npm trusted-publisher contract.
# Renaming this file breaks publishing until a human re-registers it on npmjs.com.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # the OIDC exchange with npm
  contents: write # create the GitHub Release (replaces contents: read)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the fast-forward step below needs the release branch tip and its ancestry. A
      # shallow checkout of the tag cannot prove a push is a fast-forward, so the server refuses it
      # with "fetch first". A full fetch is simpler than a deepened one and cannot miss the merge base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org' # required for the OIDC token exchange
          cache: npm

      - run: npm ci

      # Trusted publishing needs npm >= 11.5.1. Pin 11.x, never @latest: npm 12
      # defaults allowScripts off and silently skips dependency install scripts.
      # Upgrading after `npm ci` means install scripts already ran.
      - name: Pin npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # Idempotency: skip a version already on the registry, so re-runs are safe.
      - id: check
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          on_reg=$(npm view "a11y-loop@$v" version 2>/dev/null || true)
          echo "exists=$([ "$on_reg" = "$v" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: ${{ success() && steps.check.outputs.exists != 'true' }}
        run: npm publish --provenance --access public

      # GitHub Release for the tag. Runs when the npm step was skipped too
      # (version already published), so a re-run can backfill a missing Release.
      # Idempotent: an existing Release is left alone. Only tag pushes qualify,
      # since workflow_dispatch has no tag to release.
      - name: Create GitHub Release
        if: ${{ success() && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (found) exit; found = index($0, "## [" ver "]") == 1 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $ver" >&2
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "a11y-loop $ver" --notes-file notes.md --verify-tag

      # The Anthropic plugin directory tracks a git ref. A tag never moves, so a
      # tag-tracked listing needs a manual re-validate per release; a branch is
      # picked up automatically. `release` therefore only ever points at a tagged
      # release. Plain push, never forced: it creates the branch or fast-forwards
      # it, and a re-run of an older tag is rejected by the server and skipped
      # rather than moving the branch backwards. Idempotent for the current tag.
      - name: Fast-forward release branch
        if: ${{ success() && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if git push origin "$GITHUB_SHA:refs/heads/release"; then
            echo "release -> $GITHUB_REF_NAME ($GITHUB_SHA)"
          else
            git fetch --no-tags origin +refs/heads/release:refs/remotes/origin/release 2>/dev/null || true
            if ! git rev-parse --verify --quiet refs/remotes/origin/release >/dev/null; then
              echo "::error::could not create or update the release branch for $GITHUB_REF_NAME"
              exit 1
            elif git merge-base --is-ancestor refs/remotes/origin/release "$GITHUB_SHA"; then
              # The tag is a descendant of the branch tip, so this push was a fast-forward and was refused.
              echo "::error::release branch not fast-forwarded to $GITHUB_REF_NAME although it descends from the branch tip"
              exit 1
            else
              echo "::warning::release branch not fast-forwarded to $GITHUB_REF_NAME (older tag re-run, or the branch is ahead)"
            fi
          fi

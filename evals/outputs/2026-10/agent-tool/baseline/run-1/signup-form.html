<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsletter Signup</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f8;min-height:100vh;display:grid;place-items:center;padding:16px;color:#1b1f2a}
form{background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 30px rgba(20,30,80,.12);width:100%;max-width:420px}
h1{margin:0 0 6px;font-size:1.6rem}p.sub{margin:0 0 24px;color:#4a5163}
.field{margin-bottom:16px}label{display:block;font-weight:600;margin-bottom:6px;font-size:.9rem}
input[type=text],input[type=email],select{width:100%;padding:11px 12px;border:1px solid #6b7280;border-radius:8px;font:inherit;background:#fff}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #2540d9;outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:#333b4d}.check input{margin-top:3px;width:18px;height:18px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#2540d9;color:#fff;font:600 1rem system-ui;cursor:pointer;margin-top:8px}
button:hover{background:#1c33b3}#msg{margin-top:14px;color:#0b6b2e;font-weight:600}
</style></head><body>
<form id="f">
<h1>Stay in the loop</h1><p class="sub">One email a month. No spam.</p>
<div class="field"><label for="name">Name</label><input id="name" type="text" autocomplete="name" required></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="country">Country</label>
<select id="country" autocomplete="country-name" required><option value="">Select a country</option><option>United States</option><option>Canada</option><option>United Kingdom</option><option>Germany</option><option>Australia</option><option>New Zealand</option><option>Other</option></select></div>
<div class="field check"><input id="consent" type="checkbox"><label for="consent" style="font-weight:400;margin:0">I agree to receive marketing emails and can unsubscribe at any time.</label></div>
<button type="submit">Subscribe</button>
<div id="msg" role="status"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').textContent='Thanks! Check your inbox to confirm.';});
</script></body></html>

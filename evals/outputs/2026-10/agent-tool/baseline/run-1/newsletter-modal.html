<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subscribe</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:#f3f4f8;color:#1b1f2a;text-align:center;padding:16px}
.btn{padding:12px 24px;border:0;border-radius:8px;background:#2540d9;color:#fff;font:600 1rem system-ui;cursor:pointer}.btn:hover{background:#1c33b3}
.btn:focus-visible,input:focus-visible,.x:focus-visible{outline:3px solid #2540d9;outline-offset:2px}
dialog{border:0;border-radius:16px;padding:28px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:left;position:relative}
dialog::backdrop{background:rgba(10,15,40,.6)}h2{margin:0 0 6px}p{color:#4a5163;margin:0 0 18px}
label{display:block;font-weight:600;margin-bottom:6px}input{width:100%;padding:11px;border:1px solid #6b7280;border-radius:8px;font:inherit;margin-bottom:14px}
.x{position:absolute;top:10px;right:10px;border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;padding:4px 10px;border-radius:8px}
</style></head><body>
<main><h1>Our newsletter</h1><p>Product news, once a month.</p>
<button class="btn" id="open" type="button">Subscribe</button></main>
<dialog id="dlg" aria-labelledby="t">
<button class="x" type="button" id="close" aria-label="Close">&times;</button>
<h2 id="t">Subscribe</h2><p>Get our best content in your inbox.</p>
<form method="dialog" id="f"><label for="em">Email address</label><input id="em" type="email" autocomplete="email" required><button class="btn" type="submit">Sign me up</button></form>
</dialog>
<script>
const dlg=document.getElementById('dlg'),op=document.getElementById('open');
op.onclick=()=>dlg.showModal();document.getElementById('close').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',()=>op.focus());
</script></body></html>

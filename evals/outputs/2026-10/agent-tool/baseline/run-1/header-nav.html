<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Header</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#1b1f2a}
header{display:flex;align-items:center;gap:24px;padding:14px 24px;background:#fff;border-bottom:1px solid #d5d9e4;position:relative}
.logo{font-weight:800;font-size:1.4rem;color:#2540d9;text-decoration:none}
nav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0}nav a{color:#1b1f2a;text-decoration:none;font-weight:500;padding:6px 2px}nav a:hover{color:#2540d9}
.spacer{flex:1}button{background:none;border:0;padding:8px;cursor:pointer;border-radius:8px;color:#1b1f2a;display:grid;place-items:center}
button:hover{background:#eef0f7}a:focus-visible,button:focus-visible{outline:3px solid #2540d9;outline-offset:2px}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#burger{display:none}
#drawer{position:fixed;top:0;right:0;height:100%;width:260px;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.2);padding:70px 24px 24px;transform:translateX(100%);transition:transform .25s;visibility:hidden}
#drawer.open{transform:none;visibility:visible}#drawer ul{list-style:none;padding:0;margin:0}#drawer a{display:block;padding:12px 0;color:#1b1f2a;text-decoration:none;font-weight:600}
#close{position:absolute;top:14px;right:14px}
@media(max-width:720px){nav.desktop{display:none}#burger{display:grid}}
</style></head><body>
<header>
<a class="logo" href="#">Acme</a>
<nav class="desktop" aria-label="Main"><ul><li><a href="#">Product</a></li><li><a href="#">Solutions</a></li><li><a href="#">Pricing</a></li><li><a href="#">Blog</a></li><li><a href="#">Contact</a></li></ul></nav>
<span class="spacer"></span>
<button type="button" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
<button type="button" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
</header>
<div id="drawer">
<button type="button" id="close" aria-label="Close menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
<nav aria-label="Mobile"><ul><li><a href="#">Product</a></li><li><a href="#">Solutions</a></li><li><a href="#">Pricing</a></li><li><a href="#">Blog</a></li><li><a href="#">Contact</a></li></ul></nav>
</div>
<script>
const b=document.getElementById('burger'),d=document.getElementById('drawer');
function set(o){d.classList.toggle('open',o);b.setAttribute('aria-expanded',o);(o?document.getElementById('close'):b).focus()}
b.onclick=()=>set(true);document.getElementById('close').onclick=()=>set(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&d.classList.contains('open'))set(false)});
</script></body></html>

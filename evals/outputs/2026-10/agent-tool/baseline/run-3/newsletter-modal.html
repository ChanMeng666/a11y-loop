<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter Modal</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a}
button{font:inherit;cursor:pointer}
.primary{background:#4338ca;color:#fff;border:0;padding:12px 24px;border-radius:8px;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid #4338ca;outline-offset:2px}
dialog{border:0;border-radius:16px;padding:32px;width:min(400px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,42,.6)}
h2{margin:0 0 8px}
label{display:block;font-weight:600;margin:16px 0 6px}
input{width:100%;padding:10px 12px;border:1px solid #6b7280;border-radius:8px;font:inherit}
.close{position:absolute;top:10px;right:10px;background:none;border:0;font-size:1.5rem;line-height:1;padding:6px 10px;border-radius:8px}
.close:hover{background:#e2e8f0}
form .primary{width:100%;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>Stay in the loop</h1>
  <button class="primary" id="open">Subscribe</button>
</main>
<dialog id="dlg" aria-labelledby="dt">
  <button class="close" id="x" aria-label="Close" type="button">&times;</button>
  <h2 id="dt">Subscribe to our newsletter</h2>
  <p>Get product updates in your inbox.</p>
  <form method="dialog">
    <label for="email">Email address</label>
    <input type="email" id="email" autocomplete="email" required>
    <button class="primary" type="submit">Subscribe</button>
  </form>
</dialog>
<script>
const dlg=document.getElementById('dlg'),open=document.getElementById('open');
open.onclick=()=>dlg.showModal();
document.getElementById('x').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
dlg.addEventListener('close',()=>open.focus());
</script>
</body>
</html>

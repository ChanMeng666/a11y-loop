<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribe Modal</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;text-align:center;padding:16px}
.btn{padding:12px 24px;border:0;border-radius:8px;background:#4338ca;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#3730a3}
.btn:focus-visible,input:focus-visible,.close:focus-visible{outline:3px solid #4338ca;outline-offset:2px}
dialog{border:0;border-radius:16px;padding:28px;width:min(92vw,400px);box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:left}
dialog::backdrop{background:rgba(15,23,42,.6)}
h2{margin:0 0 8px}
p{color:#475569;margin:0 0 16px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input{width:100%;padding:11px 12px;border:1px solid #9ca3af;border-radius:8px;font:inherit;margin-bottom:16px}
.close{position:absolute;top:10px;right:10px;border:0;background:none;font-size:1.5rem;line-height:1;padding:6px 10px;border-radius:8px;cursor:pointer;color:#475569}
.close:hover{background:#f1f5f9}
</style>
</head>
<body>
<main>
  <h1>Stay in the loop</h1>
  <p>Get product news in your inbox.</p>
  <button class="btn" id="open" type="button">Subscribe</button>
</main>
<dialog id="dlg" aria-labelledby="t">
  <button class="close" type="button" id="close" aria-label="Close">&times;</button>
  <h2 id="t">Subscribe</h2>
  <p>Enter your email to get our monthly newsletter.</p>
  <form method="dialog" id="form">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required>
    <button class="btn" type="submit" style="width:100%">Subscribe</button>
  </form>
</dialog>
<script>
const dlg=document.getElementById('dlg'),open=document.getElementById('open');
open.addEventListener('click',()=>dlg.showModal());
document.getElementById('close').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',()=>open.focus());
</script>
</body>
</html>

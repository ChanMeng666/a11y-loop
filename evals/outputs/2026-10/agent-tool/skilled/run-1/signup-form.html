<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter signup</title>
<style>
:root{--bg:#f3f4fb;--surface:#fff;--text:#1a1d29;--muted:#4a5068;--primary:#4338ca;--on-primary:#fff;--border:#6b7088;--error:#b42318;--focus:#1d4ed8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--surface:#181c2e;--text:#eef0f8;--muted:#b4b9d0;--primary:#a5b4fc;--on-primary:#14163a;--border:#8a90ac;--error:#ff9b8f;--focus:#93c5fd}}
*{box-sizing:border-box}
body{margin:0;font:1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{min-height:100vh;display:grid;place-items:center;padding:1.5rem 1rem}
.card{background:var(--surface);width:100%;max-width:30rem;padding:2rem;border-radius:1rem;box-shadow:0 10px 30px rgba(20,20,60,.12);border:1px solid var(--border)}
h1{margin:0 0 .5rem;font-size:1.75rem;line-height:1.2}
.lead{margin:0 0 1.5rem;color:var(--muted)}
.field{margin-bottom:1.1rem}
label{display:block;font-weight:600;margin-bottom:.35rem}
input[type=text],input[type=email],select{width:100%;min-height:2.75rem;padding:.5rem .75rem;font:inherit;color:var(--text);background:var(--surface);border:2px solid var(--border);border-radius:.5rem}
.hint{display:block;color:var(--muted);font-size:.875rem;margin-top:.25rem}
.err{color:var(--error);font-size:.875rem;margin:.3rem 0 0;font-weight:600}
[aria-invalid=true]{border-color:var(--error)}
.check{display:flex;gap:.75rem;align-items:flex-start;margin-bottom:1.5rem}
.check input{width:1.5rem;height:1.5rem;margin:.1rem 0 0;flex:none;accent-color:var(--primary)}
.check label{margin:0;font-weight:400}
button{min-height:2.75rem;padding:.6rem 1.5rem;font:inherit;font-weight:700;color:var(--on-primary);background:var(--primary);border:2px solid var(--primary);border-radius:.5rem;cursor:pointer;width:100%;transition:filter .2s}
button:hover{filter:brightness(1.1)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.status{margin-top:1rem;font-weight:600}
.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;background:var(--surface);padding:.5rem;z-index:9}
@media (forced-colors:active){body,.featured *{-webkit-text-fill-color:CanvasText}button,.cta{-webkit-text-fill-color:ButtonText}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main">
<div class="card">
<h1>Get the monthly digest</h1>
<p class="lead">Product news and tips, once a month. Fields marked required must be filled in.</p>
<form id="f" novalidate>
<div class="field">
<label for="name">Name (required)</label>
<input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-err">
<p class="err" id="name-err" hidden></p>
</div>
<div class="field">
<label for="email">Email address (required)</label>
<input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-hint email-err">
<span class="hint" id="email-hint">We will never share your address.</span>
<p class="err" id="email-err" hidden></p>
</div>
<div class="field">
<label for="country">Country</label>
<select id="country" name="country" autocomplete="country-name">
<option value="">Select a country</option>
<option>Australia</option><option>Canada</option><option>France</option><option>Germany</option><option>India</option><option>New Zealand</option><option>United Kingdom</option><option>United States</option>
</select>
</div>
<div class="check">
<input type="checkbox" id="consent" name="consent">
<label for="consent">Yes, I would like to receive marketing emails. I can unsubscribe at any time.</label>
</div>
<button type="submit">Subscribe</button>
<div class="status" id="status" role="status"></div>
</form>
</div>
</main>
<script>
const f=document.getElementById('f'),st=document.getElementById('status');
function setErr(id,msg){const i=document.getElementById(id),e=document.getElementById(id+'-err');
 if(msg){e.textContent=msg;e.hidden=false;i.setAttribute('aria-invalid','true')}else{e.hidden=true;e.textContent='';i.removeAttribute('aria-invalid')}return !msg}
f.addEventListener('submit',ev=>{ev.preventDefault();
 const n=document.getElementById('name'),m=document.getElementById('email');
 const a=setErr('name',n.value.trim()?'':'Enter your name.');
 const b=setErr('email',/^\S+@\S+\.\S+$/.test(m.value)?'':'Enter an email address like name@example.com.');
 if(!a){n.focus();st.textContent='';return}
 if(!b){m.focus();st.textContent='';return}
 st.textContent='Thanks, you are subscribed.';f.reset()});
</script>
</body>
</html>

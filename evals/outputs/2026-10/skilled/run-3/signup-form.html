<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribe to the newsletter</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#111827;--muted:#4b5563;--border:#6b7280;--primary:#4338ca;--on-primary:#fff;--error:#b91c1c;--ok:#166534;--focus:#4338ca}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#1e293b;--text:#f1f5f9;--muted:#cbd5e1;--border:#94a3b8;--primary:#a5b4fc;--on-primary:#1e1b4b;--error:#fca5a5;--ok:#86efac;--focus:#a5b4fc}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:1rem}
.skip{position:absolute;left:-999px;top:0;background:var(--card);color:var(--text);padding:.5rem 1rem;z-index:10}
.skip:focus{left:1rem;top:1rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main{width:100%;max-width:30rem}
.card{background:var(--card);border-radius:1rem;padding:2rem;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{margin:0 0 .5rem;font-size:1.75rem;line-height:1.2}
.lead{margin:0 0 1.5rem;color:var(--muted)}
.field{margin-bottom:1.25rem}
label{display:block;font-weight:600;margin-bottom:.35rem}
input[type=text],input[type=email],select{width:100%;min-height:2.75rem;padding:.55rem .75rem;font:inherit;color:var(--text);background:var(--card);border:2px solid var(--border);border-radius:.5rem}
input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--error)}
.hint{margin:.3rem 0 0;font-size:.875rem;color:var(--muted)}
.error{margin:.3rem 0 0;font-size:.875rem;color:var(--error);font-weight:600}
.check{display:flex;gap:.75rem;align-items:flex-start}
.check input{width:1.5rem;height:1.5rem;margin:.1rem 0 0;flex:none;accent-color:var(--primary)}
.check label{margin:0;font-weight:400}
button[type=submit]{width:100%;min-height:3rem;border:0;border-radius:.5rem;font:inherit;font-weight:700;background:var(--primary);color:var(--on-primary);cursor:pointer;transition:transform .15s}
button[type=submit]:hover{transform:translateY(-1px)}
.status{margin-top:1rem;font-weight:600;color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (forced-colors:active){button[type=submit]{border:2px solid ButtonText}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<main id="main">
  <div class="card">
    <h1>Join our newsletter</h1>
    <p class="lead">One email a week with product news and tips. Unsubscribe any time.</p>
    <form id="f" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-err">
        <p class="error" id="name-err"></p>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-hint email-err">
        <p class="hint" id="email-hint">We will never share your address.</p>
        <p class="error" id="email-err"></p>
      </div>
      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country" autocomplete="country-name" required aria-describedby="country-err">
          <option value="">Select a country</option>
          <option>Australia</option><option>Canada</option><option>China</option><option>France</option>
          <option>Germany</option><option>India</option><option>Japan</option><option>New Zealand</option>
          <option>United Kingdom</option><option>United States</option>
        </select>
        <p class="error" id="country-err"></p>
      </div>
      <div class="field check">
        <input type="checkbox" id="consent" name="consent">
        <label for="consent">I agree to receive marketing emails. (Optional)</label>
      </div>
      <button type="submit">Subscribe</button>
      <p class="status" id="status" role="status"></p>
    </form>
  </div>
</main>
<script>
const f=document.getElementById('f'),status=document.getElementById('status');
const rules={name:v=>v.trim()?'':'Enter your full name.',email:v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?'':'Enter a valid email address, like name@example.com.',country:v=>v?'':'Select your country.'};
f.addEventListener('submit',e=>{
  e.preventDefault();status.textContent='';
  let first=null;
  for(const k in rules){
    const el=f.elements[k],msg=rules[k](el.value),err=document.getElementById(k+'-err');
    err.textContent=msg;
    if(msg){el.setAttribute('aria-invalid','true');first=first||el}else el.removeAttribute('aria-invalid');
  }
  if(first){first.focus();return}
  status.textContent='Thanks, '+f.elements.name.value.trim()+'! Check your inbox to confirm.';
  f.reset();
});
</script>
</body>
</html>

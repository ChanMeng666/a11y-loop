<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsletter signup</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--surface:#f4f5fb;--text:#1a1a2e;--muted:#4b5563;--accent:#4338ca;--on-accent:#fff;--border:#6b7280;--line:#d1d5db;--ok:#166534;--bad:#b91c1c;--focus:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--surface:#1e293b;--text:#e5e7eb;--muted:#a8b0be;--accent:#a5b4fc;--on-accent:#0f172a;--border:#94a3b8;--line:#334155;--ok:#86efac;--bad:#fca5a5;--focus:#93c5fd}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--accent);color:var(--on-accent);padding:.6rem 1rem;border-radius:.4rem;z-index:100}
.skip:focus{top:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.6rem 1.25rem;border-radius:.6rem;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.secondary{background:transparent;color:var(--accent)}
@media (forced-colors:active){.btn{border-color:ButtonText}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn:hover{transform:none}}
main{max-width:34rem;margin:0 auto;padding:3rem 1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:2rem;box-shadow:0 8px 24px rgb(0 0 0/.08)}
h1{margin:0 0 .5rem;font-size:1.8rem}
.lead{color:var(--muted);margin:0 0 1.5rem}
.field{margin-bottom:1.25rem}
label{display:block;font-weight:600;margin-bottom:.35rem}
input[type=text],input[type=email],select{width:100%;min-height:44px;padding:.5rem .75rem;font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--border);border-radius:.5rem}
.check{display:flex;gap:.75rem;align-items:flex-start}
.check input{width:24px;height:24px;margin:.1rem 0 0;flex:none;accent-color:var(--accent)}
.check label{margin:0;font-weight:400}
.hint{color:var(--muted);font-size:.9rem;margin:.25rem 0 0}
.error{color:var(--bad);font-size:.9rem;margin:.25rem 0 0;min-height:0}
[aria-invalid=true]{border-color:var(--bad)}
.status{margin-top:1rem;font-weight:600;color:var(--ok)}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<main id="main">
  <div class="card">
    <h1>Join our newsletter</h1>
    <p class="lead">One email a month with product news and tips. Unsubscribe any time.</p>
    <form id="f" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-err">
        <p class="error" id="name-err"></p>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-hint email-err">
        <p class="hint" id="email-hint">We'll never share your address.</p>
        <p class="error" id="email-err"></p>
      </div>
      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country" autocomplete="country-name" required aria-describedby="country-err">
          <option value="">Select a country</option>
          <option>Australia</option><option>Canada</option><option>France</option><option>Germany</option><option>India</option><option>Japan</option><option>New Zealand</option><option>United Kingdom</option><option>United States</option>
        </select>
        <p class="error" id="country-err"></p>
      </div>
      <div class="field check">
        <input type="checkbox" id="consent" name="consent">
        <label for="consent">I agree to receive marketing emails. I can withdraw consent at any time.</label>
      </div>
      <button class="btn" type="submit">Subscribe</button>
      <p class="status" id="status" role="status"></p>
    </form>
  </div>
</main>
<script>
const f=document.getElementById('f');
const rules=[['name','Enter your name.'],['email','Enter a valid email address.'],['country','Choose your country.']];
f.addEventListener('submit',e=>{
  e.preventDefault();
  let first=null;
  document.getElementById('status').textContent='';
  rules.forEach(([id,msg])=>{
    const el=document.getElementById(id),err=document.getElementById(id+'-err');
    const ok=el.value.trim()!==''&&el.checkValidity();
    el.setAttribute('aria-invalid',ok?'false':'true');
    err.textContent=ok?'':msg;
    if(!ok&&!first)first=el;
  });
  if(first){first.focus();return}
  document.getElementById('status').textContent='Thanks! You are subscribed.';
  f.reset();
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acme – Home</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--surface:#f4f5fb;--text:#1a1a2e;--muted:#4b5563;--accent:#4338ca;--on-accent:#fff;--border:#6b7280;--line:#d1d5db;--ok:#166534;--bad:#b91c1c;--focus:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--surface:#1e293b;--text:#e5e7eb;--muted:#a8b0be;--accent:#a5b4fc;--on-accent:#0f172a;--border:#94a3b8;--line:#334155;--ok:#86efac;--bad:#fca5a5;--focus:#93c5fd}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--accent);color:var(--on-accent);padding:.6rem 1rem;border-radius:.4rem;z-index:100}
.skip:focus{top:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.6rem 1.25rem;border-radius:.6rem;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.secondary{background:transparent;color:var(--accent)}
@media (forced-colors:active){.btn{border-color:ButtonText}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn:hover{transform:none}}
header{border-bottom:1px solid var(--line);background:var(--bg);position:relative}
.bar{flex-wrap:wrap;max-width:72rem;margin:0 auto;padding:.5rem 1.25rem;display:flex;align-items:center;gap:1rem}
.logo{font-weight:800;font-size:1.4rem;color:var(--text);text-decoration:none;margin-right:auto;padding:.4rem 0}
.logo span{color:var(--accent)}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:.25rem}
nav a{display:inline-block;padding:.6rem .9rem;color:var(--text);text-decoration:none;border-radius:.4rem;font-weight:500}
nav a:hover{background:var(--surface)}
nav a[aria-current=page]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px;font-weight:700}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--text);border:2px solid transparent;border-radius:.5rem;cursor:pointer}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#menu-btn{display:none}
#search-form{display:none;border-top:1px solid var(--line);padding:.75rem 1.25rem;max-width:72rem;margin:0 auto;gap:.5rem}
#search-form.open{display:flex}
#search-form input{flex:1;min-height:44px;padding:.5rem .75rem;font:inherit;background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
main{max-width:50rem;margin:0 auto;padding:3rem 1.25rem}
@media (max-width:48rem){
  #menu-btn{display:inline-flex}
  #site-nav{display:none;order:10;flex-basis:100%;padding:.25rem 0 .75rem}
  #site-nav.open{display:block}
  nav ul{flex-direction:column}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <div class="bar">
    <a class="logo" href="#">Ac<span>me</span></a>
    <nav id="site-nav" aria-label="Main">
      <ul>
        <li><a href="#" aria-current="page">Home</a></li>
        <li><a href="#products">Products</a></li>
        <li><a href="#solutions">Solutions</a></li>
        <li><a href="#pricing">Pricing</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <button type="button" class="icon-btn" id="search-btn" aria-expanded="false" aria-controls="search-form" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
    <button type="button" class="icon-btn" id="menu-btn" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <form id="search-form" role="search" aria-label="Site">
    <label for="q" class="sr">Search the site</label>
    <input type="search" id="q" name="q" autocomplete="off">
    <button class="btn" type="submit">Search</button>
  </form>
</header>
<main id="main">
  <h1>Welcome to Acme</h1>
  <p>Resize the window below 768px to use the hamburger menu.</p>
</main>
<script>
const mb=document.getElementById('menu-btn'),nav=document.getElementById('site-nav'),
 sb=document.getElementById('search-btn'),sf=document.getElementById('search-form');
function toggle(btn,el,focus){const o=btn.getAttribute('aria-expanded')!=='true';btn.setAttribute('aria-expanded',o);el.classList.toggle('open',o);if(o&&focus)focus.focus()}
mb.addEventListener('click',()=>toggle(mb,nav));
sb.addEventListener('click',()=>toggle(sb,sf,document.getElementById('q')));
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(mb.getAttribute('aria-expanded')==='true'){toggle(mb,nav);mb.focus()}
  else if(sb.getAttribute('aria-expanded')==='true'){toggle(sb,sf);sb.focus()}
});
sf.addEventListener('submit',e=>e.preventDefault());
</script>
</body>
</html>

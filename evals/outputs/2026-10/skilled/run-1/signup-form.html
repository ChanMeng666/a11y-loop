<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsletter signup</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--surface:#f4f4f8;--text:#1a1a2e;--muted:#52525b;--primary:#4338ca;--on-primary:#fff;--border:#71717a;--line:#d4d4d8;--err:#b91c1c;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1020;--surface:#1b1c33;--text:#ececf4;--muted:#a8a8be;--primary:#a5b4fc;--on-primary:#12123a;--border:#8b8ba3;--line:#34354f;--err:#fca5a5;--ok:#86efac}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.skip{position:absolute;left:8px;top:-60px;background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:6px;z-index:100}
.skip:focus{top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.secondary{background:transparent;color:var(--primary)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
main{max-width:520px;margin:0 auto;padding:48px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:1.75rem}
.lead{color:var(--muted);margin:0 0 24px}
.field{margin-bottom:20px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email],select{width:100%;min-height:44px;padding:8px 12px;font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--border);border-radius:8px}
.hint{color:var(--muted);font-size:.875rem;margin:4px 0 0}
.error{color:var(--err);font-size:.875rem;margin:4px 0 0;min-height:1.4em}
[aria-invalid=true]{border-color:var(--err)!important}
.check{display:flex;gap:12px;align-items:flex-start;margin-bottom:24px}
.check input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--primary);flex:none}
.check label{margin:0;font-weight:400}
.status{margin-top:16px;font-weight:600;color:var(--ok);min-height:1.5em}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<main id="main">
<div class="card">
<h1>Get the weekly digest</h1>
<p class="lead">One email a week with product news and tips. Unsubscribe any time.</p>
<form id="f" novalidate>
<div class="field">
<label for="name">Full name</label>
<input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-err">
<p class="error" id="name-err" role="alert"></p>
</div>
<div class="field">
<label for="email">Email address</label>
<input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-hint email-err">
<p class="hint" id="email-hint">We'll never share your address.</p>
<p class="error" id="email-err" role="alert"></p>
</div>
<div class="field">
<label for="country">Country or region</label>
<select id="country" name="country" autocomplete="country-name" required aria-describedby="country-err">
<option value="">Select a country</option>
<option>Australia</option><option>Canada</option><option>China</option><option>France</option><option>Germany</option><option>India</option><option>Japan</option><option>New Zealand</option><option>United Kingdom</option><option>United States</option>
</select>
<p class="error" id="country-err" role="alert"></p>
</div>
<div class="check">
<input type="checkbox" id="consent" name="consent">
<label for="consent">Yes, I'd like to receive marketing emails about new features and offers. (Optional)</label>
</div>
<button class="btn" type="submit" id="submit">Subscribe</button>
<p class="status" id="status" role="status"></p>
</form>
</div>
</main>
<script>
const f=document.getElementById('f'),status=document.getElementById('status');
const checks=[['name',v=>v.trim()?'':'Enter your name.'],['email',v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?'':'Enter an email address like name@example.com.'],['country',v=>v?'':'Choose your country.']];
f.addEventListener('submit',e=>{
 e.preventDefault();status.textContent='';
 let first=null;
 for(const [id,fn] of checks){
  const el=document.getElementById(id),msg=fn(el.value),err=document.getElementById(id+'-err');
  err.textContent=msg;
  if(msg){el.setAttribute('aria-invalid','true');first=first||el}else el.removeAttribute('aria-invalid');
 }
 if(first){first.focus();return}
 status.textContent='Thanks! Check your inbox to confirm your subscription.';f.reset();
});
</script>
</body>
</html>

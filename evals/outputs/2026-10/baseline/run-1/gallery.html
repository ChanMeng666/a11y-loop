<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Stories</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
  section { max-width: 1120px; margin: 0 auto; padding: 64px 24px; }
  h1 { text-align: center; margin: 0 0 8px; font-size: 2.1rem; }
  .lead { text-align: center; color: #64748b; margin: 0 0 44px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
  .card:hover, .card:focus-within { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(15,23,42,.12); }
  .card svg { display: block; width: 100%; height: auto; }
  .body { padding: 20px 22px 24px; display: flex; flex-direction: column; flex: 1; }
  .name { font-weight: 700; margin: 0 0 2px; }
  .role { color: #64748b; font-size: .85rem; margin: 0 0 12px; }
  blockquote { margin: 0 0 16px; flex: 1; color: #334155; line-height: 1.55; }
  a { color: #4f46e5; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<section aria-labelledby="t">
  <h1 id="t">Customer stories</h1>
  <p class="lead">See how teams like yours get results.</p>
  <div class="grid" id="grid"></div>
</section>
<script>
  const stories = [
    { name: 'Maya Chen', role: 'COO, Lumen Labs', c1: '#6366f1', c2: '#a5b4fc', quote: 'We cut onboarding time by 60% in the first month.' },
    { name: 'Daniel Okafor', role: 'CTO, Brightpath', c1: '#0ea5e9', c2: '#7dd3fc', quote: 'The migration took a weekend. The payoff has lasted all year.' },
    { name: 'Sofia Rossi', role: 'Head of Ops, Verde', c1: '#10b981', c2: '#6ee7b7', quote: 'Finally, one place where the whole team sees the same numbers.' },
    { name: 'Arjun Patel', role: 'Founder, Kite', c1: '#f59e0b', c2: '#fcd34d', quote: 'Support is fast, human and genuinely helpful. Rare these days.' },
    { name: 'Hannah Müller', role: 'VP Product, Northwind', c1: '#ec4899', c2: '#f9a8d4', quote: 'Shipping velocity doubled once we adopted the workflow.' },
    { name: 'Leo Tanaka', role: 'Engineer, Orbit', c1: '#8b5cf6', c2: '#c4b5fd', quote: 'The API is clean and the docs are the best I have used.' }
  ];
  const grid = document.getElementById('grid');
  stories.forEach((s, i) => {
    const initials = s.name.split(' ').map(w => w[0]).join('');
    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = `
      <svg viewBox="0 0 320 180" role="img" aria-label="Photo placeholder for ${s.name}">
        <defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${s.c1}"/><stop offset="1" stop-color="${s.c2}"/></linearGradient></defs>
        <rect width="320" height="180" fill="url(#g${i})"/>
        <circle cx="160" cy="72" r="30" fill="rgba(255,255,255,.85)"/>
        <path d="M96 180c0-38 28-58 64-58s64 20 64 58z" fill="rgba(255,255,255,.85)"/>
        <text x="160" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="${s.c1}">${initials}</text>
      </svg>
      <div class="body">
        <p class="name">${s.name}</p>
        <p class="role">${s.role}</p>
        <blockquote>“${s.quote}”</blockquote>
        <a href="#story-${i + 1}" aria-label="Read the full story of ${s.name}">Read full story →</a>
      </div>`;
    grid.appendChild(el);
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Stories</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; background: #f9fafb; }
  section { max-width: 1100px; margin: 0 auto; padding: 64px 24px; }
  h1 { text-align: center; margin: 0 0 8px; font-size: 2.1rem; }
  .sub { text-align: center; color: #6b7280; margin: 0 0 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
  .card { display: flex; flex-direction: column; background: #fff; border-radius: 14px; overflow: hidden;
    border: 1px solid #e5e7eb; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0, 0, 0, .1); }
  .card svg { display: block; width: 100%; height: auto; }
  .body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
  blockquote { margin: 0 0 16px; color: #374151; line-height: 1.5; flex: 1; }
  .name { font-weight: 700; }
  .role { color: #6b7280; font-size: .85rem; margin-bottom: 12px; }
  a { color: #4f46e5; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 3px solid #c7d2fe; outline-offset: 2px; border-radius: 3px; }
</style>
</head>
<body>
<section aria-labelledby="stories-title">
  <h1 id="stories-title">Customer stories</h1>
  <p class="sub">See how teams like yours get results.</p>
  <div class="grid" id="grid"></div>
</section>
<script>
  const stories = [
    { name: 'Maria Lopez', role: 'COO, Brightwave', hue: 250, quote: 'We cut onboarding time in half within the first month.' },
    { name: 'Daniel Kim', role: 'CTO, Northpeak', hue: 200, quote: 'The most reliable platform we have integrated, hands down.' },
    { name: 'Aisha Rahman', role: 'Founder, Loomly Studio', hue: 330, quote: 'Setup took an afternoon, and our team has not looked back.' },
    { name: 'Tom Becker', role: 'Head of Ops, Gridline', hue: 150, quote: 'Support is fast and genuinely helpful. It feels like a partner.' },
    { name: 'Yuki Tanaka', role: 'PM, Kaizen Labs', hue: 20, quote: 'Our reporting went from days of work to a single click.' },
    { name: 'Sophie Martin', role: 'CEO, Atelier Verde', hue: 100, quote: 'Revenue grew 40% after we moved our workflow over.' }
  ];
  // Escape text before inserting into HTML.
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  document.getElementById('grid').innerHTML = stories.map((s, i) => {
    const initials = s.name.split(' ').map(w => w[0]).join('');
    return `<article class="card">
      <svg viewBox="0 0 400 220" role="img" aria-label="Photo placeholder for ${esc(s.name)}">
        <defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="hsl(${s.hue},70%,70%)"/><stop offset="1" stop-color="hsl(${s.hue + 40},70%,45%)"/>
        </linearGradient></defs>
        <rect width="400" height="220" fill="url(#g${i})"/>
        <circle cx="200" cy="90" r="38" fill="rgba(255,255,255,.85)"/>
        <path d="M120 220c0-48 36-78 80-78s80 30 80 78z" fill="rgba(255,255,255,.85)"/>
        <text x="200" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="hsl(${s.hue + 40},70%,35%)">${esc(initials)}</text>
      </svg>
      <div class="body">
        <blockquote>&ldquo;${esc(s.quote)}&rdquo;</blockquote>
        <div class="name">${esc(s.name)}</div>
        <div class="role">${esc(s.role)}</div>
        <a href="#story-${i + 1}">Read the full story<span class="sr" aria-hidden="true"> &rarr;</span><span style="position:absolute;left:-9999px"> about ${esc(s.name)}</span></a>
      </div>
    </article>`;
  }).join('');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter Signup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937;
    background: linear-gradient(135deg, #eef2ff, #fdf2f8); }
  .card { width: 100%; max-width: 440px; background: #fff; border-radius: 16px; padding: 32px;
    box-shadow: 0 10px 30px rgba(31, 41, 55, .1); }
  h1 { margin: 0 0 6px; font-size: 1.6rem; }
  .lead { margin: 0 0 24px; color: #6b7280; }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  input[type=text], input[type=email], select { width: 100%; padding: 11px 12px; font: inherit;
    border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #c7d2fe; outline-offset: 1px; border-color: #6366f1; }
  .field.invalid input, .field.invalid select { border-color: #dc2626; }
  .error { display: none; color: #b91c1c; font-size: .82rem; margin-top: 4px; }
  .field.invalid .error { display: block; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; color: #4b5563; }
  .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: #4f46e5; }
  .check label { font-weight: 400; margin: 0; }
  button[type=submit] { width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: #4f46e5; border: 0; border-radius: 8px; transition: background .15s; }
  button[type=submit]:hover { background: #4338ca; }
  .success { display: none; text-align: center; padding: 16px 0; }
  .success.show { display: block; }
  .small { font-size: .78rem; color: #9ca3af; margin: 14px 0 0; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <form id="form" novalidate>
    <h1>Stay in the loop</h1>
    <p class="lead">Product news and tips, once a month. No spam.</p>

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
      <div class="error" id="name-err">Please enter your name.</div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <div class="error" id="email-err">Please enter a valid email address.</div>
    </div>
    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="">Select a country…</option>
        <option>Australia</option><option>Brazil</option><option>Canada</option><option>China</option>
        <option>France</option><option>Germany</option><option>India</option><option>Japan</option>
        <option>Mexico</option><option>United Kingdom</option><option>United States</option><option>Other</option>
      </select>
      <div class="error">Please choose your country.</div>
    </div>
    <div class="field check">
      <input type="checkbox" id="consent" name="consent">
      <label for="consent">I agree to receive marketing emails and can unsubscribe at any time.</label>
    </div>
    <button type="submit">Subscribe</button>
    <p class="small">We respect your privacy.</p>
  </form>
  <div class="success" id="success" role="status" aria-live="polite">
    <h1>Thanks, <span id="who"></span>!</h1>
    <p class="lead">Check your inbox to confirm your subscription.</p>
  </div>
</main>
<script>
  const form = document.getElementById('form');
  const fields = ['name', 'email', 'country'];
  const valid = {
    name: v => v.trim().length > 0,
    email: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
    country: v => v !== ''
  };
  function check(id) {
    const el = document.getElementById(id);
    const ok = valid[id](el.value);
    el.closest('.field').classList.toggle('invalid', !ok);
    el.setAttribute('aria-invalid', String(!ok));
    return ok;
  }
  fields.forEach(id => document.getElementById(id).addEventListener('blur', () => check(id)));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const results = fields.map(check);
    if (results.includes(false)) { document.getElementById(fields[results.indexOf(false)]).focus(); return; }
    document.getElementById('who').textContent = document.getElementById('name').value.trim();
    form.style.display = 'none';
    document.getElementById('success').classList.add('show');
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter Signup</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef2ff,#f8fafc);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a;padding:24px}
  .card{width:100%;max-width:440px;background:#fff;border-radius:16px;padding:32px;box-shadow:0 10px 40px rgba(15,23,42,.1)}
  h1{margin:0 0 6px;font-size:1.6rem}
  p.sub{margin:0 0 24px;color:#64748b}
  .field{margin-bottom:18px}
  label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  input[type=text],input[type=email],select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
  input:focus,select:focus{outline:2px solid #6366f1;outline-offset:1px;border-color:#6366f1}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:#475569}
  .check input{margin-top:3px;width:16px;height:16px}
  .err{color:#dc2626;font-size:.8rem;margin-top:4px;min-height:1em}
  button{width:100%;padding:12px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
  button:hover{background:#4338ca}
  button:focus-visible{outline:2px solid #4338ca;outline-offset:2px}
  .ok{display:none;text-align:center;color:#15803d;font-weight:600}
</style>
</head>
<body>
<main class="card">
  <h1>Stay in the loop</h1>
  <p class="sub">Product news and tips, once a month.</p>
  <form id="f" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
      <div class="err" id="e-name"></div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <div class="err" id="e-email"></div>
    </div>
    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="">Select a country…</option>
        <option>Australia</option><option>Canada</option><option>China</option>
        <option>France</option><option>Germany</option><option>India</option>
        <option>Japan</option><option>United Kingdom</option><option>United States</option>
        <option>Other</option>
      </select>
      <div class="err" id="e-country"></div>
    </div>
    <div class="field">
      <label class="check" for="consent" style="font-weight:400">
        <input id="consent" name="consent" type="checkbox">
        <span>I agree to receive marketing emails and can unsubscribe at any time.</span>
      </label>
      <div class="err" id="e-consent"></div>
    </div>
    <button type="submit">Subscribe</button>
    <p class="ok" id="ok" role="status">Thanks for subscribing!</p>
  </form>
</main>
<script>
  const f = document.getElementById('f');
  const set = (id, msg) => { document.getElementById('e-' + id).textContent = msg; return !msg; };
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = n => f.elements[n];
    let ok = true;
    ok = set('name', v('name').value.trim() ? '' : 'Please enter your name.') && ok;
    ok = set('email', /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email').value) ? '' : 'Enter a valid email.') && ok;
    ok = set('country', v('country').value ? '' : 'Please choose a country.') && ok;
    ok = set('consent', v('consent').checked ? '' : 'Consent is required to subscribe.') && ok;
    if (ok) { document.getElementById('ok').style.display = 'block'; f.reset(); }
  });
</script>
</body>
</html>

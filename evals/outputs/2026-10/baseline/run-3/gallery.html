<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Stories</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a}
  section{max-width:1100px;margin:0 auto;padding:64px 24px}
  h1{text-align:center;margin:0 0 8px;font-size:2.1rem}
  .lead{text-align:center;color:#64748b;margin:0 0 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
  .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.08);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(15,23,42,.12)}
  .card svg{display:block;width:100%;height:180px}
  .body{padding:20px;display:flex;flex-direction:column;flex:1}
  h2{margin:0 0 2px;font-size:1.05rem}
  .role{margin:0 0 12px;font-size:.85rem;color:#64748b}
  blockquote{margin:0 0 16px;flex:1;color:#334155;line-height:1.5}
  a{color:#4f46e5;font-weight:600;text-decoration:none}
  a:hover{text-decoration:underline}
  a:focus-visible{outline:2px solid #4f46e5;outline-offset:2px;border-radius:2px}
</style>
</head>
<body>
<section>
  <h1>Customer stories</h1>
  <p class="lead">See how teams like yours get results.</p>
  <div class="grid" id="grid"></div>
</section>
<script>
  const stories = [
    ['Maria Alvarez','COO, Brightline','Onboarding time dropped by 60% in the first month.','#6366f1','#a5b4fc'],
    ['Daniel Okafor','CTO, Nimbus Labs','We shipped features twice as fast with far fewer incidents.','#0ea5e9','#7dd3fc'],
    ['Priya Nair','Founder, Greenleaf','It paid for itself in the first quarter. No-brainer.','#10b981','#6ee7b7'],
    ['Lukas Weber','Head of Ops, Kestrel','Finally one place where the whole team sees the same data.','#f59e0b','#fcd34d'],
    ['Aiko Tanaka','Product Lead, Sora','Support tickets fell by 40% after we switched.','#ec4899','#f9a8d4'],
    ['Tom Becker','CEO, Harbor &amp; Co.','Setup took an afternoon, and the team loved it from day one.','#8b5cf6','#c4b5fd']
  ];
  const photo = (c1, c2, i) => `
    <svg viewBox="0 0 300 180" role="img" aria-label="Photo placeholder">
      <defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
      <rect width="300" height="180" fill="url(#g${i})"/>
      <circle cx="150" cy="72" r="30" fill="rgba(255,255,255,.85)"/>
      <path d="M85 180c0-38 29-60 65-60s65 22 65 60z" fill="rgba(255,255,255,.85)"/>
    </svg>`;
  document.getElementById('grid').innerHTML = stories.map((s, i) => `
    <article class="card">
      ${photo(s[3], s[4], i)}
      <div class="body">
        <h2>${s[0]}</h2>
        <p class="role">${s[1]}</p>
        <blockquote>“${s[2]}”</blockquote>
        <a href="#story-${i + 1}">Read full story →</a>
      </div>
    </article>`).join('');
</script>
</body>
</html>

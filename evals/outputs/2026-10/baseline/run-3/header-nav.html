<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Header</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a;background:#f8fafc;min-height:100vh}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e2e8f0}
  .bar{max-width:1100px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:24px}
  .logo{font-weight:800;font-size:1.3rem;color:#4f46e5;text-decoration:none;letter-spacing:-.02em}
  nav.main{display:flex;gap:4px;margin-left:16px;flex:1}
  nav a{color:#334155;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500}
  nav a:hover{background:#eef2ff;color:#4f46e5}
  a:focus-visible,button:focus-visible{outline:2px solid #4f46e5;outline-offset:2px}
  .icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:#334155}
  .icon-btn:hover{background:#eef2ff;color:#4f46e5}
  .icon-btn svg{width:22px;height:22px}
  .burger{display:none}
  .drawer{position:fixed;inset:64px 0 0 0;background:#fff;padding:16px 24px;transform:translateX(100%);transition:transform .25s;visibility:hidden;z-index:10;overflow:auto}
  .drawer.open{transform:none;visibility:visible}
  .drawer a{display:block;padding:14px 4px;border-bottom:1px solid #f1f5f9;color:#0f172a;text-decoration:none;font-size:1.1rem}
  main{max-width:1100px;margin:0 auto;padding:40px 24px}
  @media(max-width:760px){
    nav.main{display:none}
    .bar{justify-content:space-between}
    .spacer{flex:1}
    .burger{display:grid}
  }
  @media(min-width:761px){.drawer{display:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#">Acme</a>
    <nav class="main" aria-label="Main">
      <a href="#products">Products</a>
      <a href="#solutions">Solutions</a>
      <a href="#pricing">Pricing</a>
      <a href="#blog">Blog</a>
      <a href="#about">About</a>
    </nav>
    <button class="icon-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path id="burger-icon" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <nav class="drawer" id="drawer" aria-label="Mobile">
    <a href="#products">Products</a>
    <a href="#solutions">Solutions</a>
    <a href="#pricing">Pricing</a>
    <a href="#blog">Blog</a>
    <a href="#about">About</a>
  </nav>
</header>
<main><h1>Page content</h1><p>Resize the window below 760px to see the hamburger menu.</p></main>
<script>
  const burger = document.getElementById('burger');
  const drawer = document.getElementById('drawer');
  const icon = document.getElementById('burger-icon');
  function toggle(open) {
    drawer.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open);
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    icon.setAttribute('d', open ? 'M6 6l12 12M18 6 6 18' : 'M4 6h16M4 12h16M4 18h16');
  }
  burger.addEventListener('click', () => toggle(!drawer.classList.contains('open')));
  drawer.addEventListener('click', e => { if (e.target.tagName === 'A') toggle(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
  matchMedia('(min-width:761px)').addEventListener('change', e => e.matches && toggle(false));
</script>
</body>
</html>

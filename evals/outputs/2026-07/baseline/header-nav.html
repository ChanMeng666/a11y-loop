<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Header Navigation</title>
<style>
  :root {
    --primary: #4f46e5;
    --text: #1f2333;
    --muted: #6b7280;
    --border: #e5e7f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #fff;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 68px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 100;
  }
  .logo {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--primary);
    text-decoration: none;
    letter-spacing: -0.02em;
  }
  nav.desktop-nav {
    display: flex;
    gap: 32px;
  }
  nav.desktop-nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: color 0.15s ease;
  }
  nav.desktop-nav a:hover { color: var(--primary); }
  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s ease;
  }
  .icon-btn:hover { background: #f7f8fc; }
  .hamburger { display: none; }
  @media (max-width: 800px) {
    nav.desktop-nav { display: none; }
    .hamburger { display: inline-flex; }
  }

  /* Mobile drawer */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 17, 32, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 150;
  }
  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 280px;
    max-width: 80vw;
    background: #fff;
    box-shadow: -8px 0 30px rgba(0,0,0,0.12);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 200;
    display: flex;
    flex-direction: column;
    padding: 24px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .drawer-header .logo { font-size: 1.15rem; }
  .drawer nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .drawer nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 12px 8px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .drawer nav a:hover { background: #f7f8fc; color: var(--primary); }

  .content {
    padding: 60px 32px;
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    color: var(--muted);
  }
  .content h1 { color: var(--text); }
</style>
</head>
<body>

  <header>
    <a href="#" class="logo">Brandly</a>

    <nav class="desktop-nav">
      <a href="#">Product</a>
      <a href="#">Features</a>
      <a href="#">Pricing</a>
      <a href="#">Resources</a>
      <a href="#">Company</a>
    </nav>

    <div class="actions">
      <button class="icon-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button class="icon-btn hamburger" id="hamburgerBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="logo">Brandly</span>
      <button class="icon-btn" id="closeDrawerBtn" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <nav>
      <a href="#">Product</a>
      <a href="#">Features</a>
      <a href="#">Pricing</a>
      <a href="#">Resources</a>
      <a href="#">Company</a>
    </nav>
  </div>

  <div class="content">
    <h1>Resize the window below 800px</h1>
    <p>...to see the hamburger menu appear and toggle the mobile drawer.</p>
  </div>

  <script>
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');

    function openDrawer() {
      drawer.classList.add('open');
      overlay.classList.add('open');
    }
    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('open');
    }

    hamburgerBtn.addEventListener('click', openDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);
  </script>

</body>
</html>

<!DOCTYPE html>
<!-- FIXTURE: status-not-announced. A "Saved" message no screen reader hears.

     Pressing "Save display name" inserts a paragraph after the button saying the
     name was saved. It is not in a live region and focus stays on the button,
     so a sighted user sees the confirmation and a screen reader user is told
     nothing. That is the one defect (SC 4.1.3 Status Messages).

     See fixture-status-announced.html for the same form done right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture — status message outside a live region</title>
<style>
  :root {
    --page: #ffffff;
    --ink: #1f2a33;    /* 14.61:1 on --page */
    --brand: #0d6157;  /*  7.33:1 behind white text */
    --border: #5d6d78; /*  5.35:1 on --page */
    --focus: #0a5cc7;  /*  6.23:1 on --page */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; padding: 1.5rem; }
  h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    box-shadow: 0 0 0 2px var(--page);
  }
  label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
  input {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 0.5rem 0.625rem;
    margin-bottom: 1rem;
    background: var(--page);
    color: var(--ink);
    border: 2px solid var(--border);
    border-radius: 6px;
    font: inherit;
  }
  button {
    min-height: 48px;
    min-width: 48px;
    padding: 0.625rem 1.125rem;
    background: var(--brand);
    color: #ffffff;
    border: 2px solid transparent;
    border-radius: 6px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>Profile</h1>
  <form id="profile">
    <label for="displayName">Display name</label>
    <input id="displayName" type="text" autocomplete="nickname" value="Ari">
    <button type="button" id="save">Save display name</button>
  </form>
</main>
<script>
  document.getElementById('save').addEventListener('click', () => {
    // DEFECT: a status message in a plain paragraph, outside any live region.
    const message = document.createElement('p');
    message.textContent = 'Saved. Your display name is updated.';
    document.getElementById('profile').append(message);
  });
</script>
</body>
</html>

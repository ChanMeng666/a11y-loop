<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture — images with no text alternative</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #1f2a33;
         font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; padding: 1.5rem; }
  h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
  a { color: #0b5a52; }
  :focus-visible { outline: 3px solid #0a5cc7; outline-offset: 2px; }
  img { display: block; max-width: 100%; height: auto; margin: 0 0 0.75rem;
        border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Images with no text alternative</h1>
  <p>The first image has alt text. The two below it have no alt attribute at all.</p>

  <img width="120" height="60" alt="A teal rectangle, 120 by 60 pixels."
       src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 60'%3E%3Crect width='120' height='60' fill='%230D6157'/%3E%3C/svg%3E">

  <!-- DEFECT: axe `image-alt` — no alt attribute -->
  <img width="120" height="60"
       src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 60'%3E%3Crect width='120' height='60' fill='%239E2A14'/%3E%3C/svg%3E">

  <!-- DEFECT: axe `image-alt` — no alt attribute -->
  <img width="120" height="60"
       src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 60'%3E%3Crect width='120' height='60' fill='%230A5CC7'/%3E%3C/svg%3E">
</main>
</body>
</html>
